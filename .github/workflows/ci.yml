name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js and run Frontend Linting
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Frontend Dependencies and Lint
        working-directory: ./frontend
        run: |
          npm install
          npm run lint

      # 3. Test if the Backend Dockerfile builds successfully
      - name: Build Backend Docker Image
        run: docker build -t my-backend -f backend/Dockerfile .

      # 4. Test if the Frontend Dockerfile builds successfully
      - name: Build Frontend Docker Image
        run: docker build -t my-frontend -f frontend/Dockerfile ./frontend
        
      # 5. Verify Docker Compose can start everything successfully
      - name: Test Docker Compose Build
        run: docker compose build



