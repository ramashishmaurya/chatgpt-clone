version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Syncs your local backend folder with the container so you don't have to rebuild on every code change
      - ./backend:/app
    environment:
      # You can add your .env variables here or let docker compose read your .env file
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Syncs your local frontend folder to see instant changes
      - ./frontend:/app
      # Prevents local node_modules from overwriting the container's node_modules
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
